cases:
  # ------------------------------------------------------------------
  # Inicio de conversación y anuncios (chats reales 01, 04, 05)
  # ------------------------------------------------------------------
  - id: C-01
    category: inicio
    source: "chat04, chat05"
    turns:
      - user: "¡Hola! Quiero más información."
    expect:
      must:
        - Saluda y pregunta qué producto o qué tipo de regalo busca.
        - Puede mencionar las categorías disponibles.
      must_not:
        - Lista el catálogo completo producto por producto.
      handoff: "no"

  - id: C-02
    category: inicio
    source: "chat01"
    turns:
      - user: "Cuanto cuesta"
    expect:
      must:
        - Pregunta qué producto le interesó.
      must_not:
        - Da un precio sin saber de qué producto se trata.
      handoff: "no"

  - id: C-03
    category: rafaga
    source: "chat01"
    notes: "Los cuatro mensajes llegan en menos de un minuto; el agente responde una sola vez."
    turns:
      - user: "Vi el vaso con abridor. Cuanto cuesta"
        burst:
          - "Con el nombre grabado"
          - "Q tan grande es?"
          - "3 necesito"
    expect:
      tools_called: [buscar_productos]
      must:
        - Responde en un solo mensaje con el precio del vaso, sus medidas y el total para 3 unidades.
        - Indica que el grabado del nombre se incluye en la personalización.
      must_not:
        - Envía varias respuestas separadas, una por mensaje.
      handoff: "no"

  - id: C-04
    category: recomendacion
    source: "chat04"
    turns:
      - user: "Estoy buscando un regalo para un graduado universitario"
      - user: "Para varón"
    expect:
      tools_called: [buscar_productos]
      must:
        - Muestra pocas opciones (como máximo 5) relacionadas con graduación o regalo para él, con su precio.
        - Ofrece mostrar fotos o dar más detalles.
      must_not:
        - Lista todo el catálogo.
        - Recomienda productos que no existen en el catálogo.
      handoff: "no"

  # ------------------------------------------------------------------
  # Consultas de producto
  # ------------------------------------------------------------------
  - id: P-01
    category: producto
    source: "chat01"
    context:
      conversacion:
        - cliente: "Hola, vi el vaso con abridor"
        - agente: "¡Hola! El Vaso con abridor cuesta 35.000 Gs. y se puede personalizar con grabado. ¿Querés que te cuente más?"
    turns:
      - user: "Q tan grande es?"
    expect:
      tools_called: [ver_producto]
      must:
        - Responde con las medidas y la capacidad del vaso según el catálogo (16.5 x 9 cm, 502 ml).
      must_not:
        - Inventa medidas.
      handoff: "no"

  - id: P-02
    category: producto
    turns:
      - user: "¿Tienen billeteras?"
    expect:
      tools_called: [buscar_productos]
      must:
        - Confirma que hay billeteras y muestra los modelos femenino y masculino con sus precios.
      handoff: "no"

  - id: P-03
    category: producto
    turns:
      - user: "¿Las billeteras son de cuero genuino?"
    expect:
      must:
        - Responde que son de cuero sintético, según el catálogo.
      must_not:
        - Afirma que son de cuero genuino.
      handoff: "no"

  - id: P-04
    category: producto
    turns:
      - user: "¿Tienen el kit de mate en lila?"
    expect:
      must:
        - Dice que no hay lila y ofrece los colores disponibles del kit.
      must_not:
        - Afirma que existe el kit en lila.
      handoff: "no"

  - id: P-05
    category: producto
    turns:
      - user: "Quiero el kit de mate rosa claro"
    expect:
      must:
        - Informa que el rosa claro está agotado.
        - Ofrece otros colores disponibles del kit, por ejemplo el rosa oscuro.
      must_not:
        - Avanza con la cotización del rosa claro.
        - Dice que el producto no existe.
      handoff: "ofrece"

  - id: P-06
    category: producto
    source: "chat06"
    turns:
      - user: "Hola buenas"
      - user: "[imagen de una caja de regalo]"
        attachment: image
      - user: "¿Está clase de caja disponen? En color azul noche"
    expect:
      must:
        - Informa qué cajas hay realmente en el catálogo y en qué colores (la caja para termo de mate, en negro).
        - Ofrece mostrar una foto o las medidas.
      must_not:
        - Afirma que tiene la caja en azul noche.
      handoff: "no"

  - id: P-07
    category: producto
    source: "chat06"
    turns:
      - user: "¿La caja para termo de mate cuánto está y qué medida tiene?"
      - user: "Necesito 5"
    expect:
      tools_called: [ver_producto]
      must:
        - Da el precio (45.000 Gs.) y las medidas (40 x 18 x 11 cm).
        - Confirma que hay stock para 5 unidades y calcula el total (225.000 Gs.).
      handoff: "no"

  # ------------------------------------------------------------------
  # Políticas
  # ------------------------------------------------------------------
  - id: POL-01
    category: politicas
    source: "chat06"
    turns:
      - user: "Tienen pos?"
    expect:
      must:
        - Responde que el pago es solo por transferencia bancaria.
      must_not:
        - Ofrece otros medios de pago.
      handoff: "no"

  - id: POL-02
    category: politicas
    source: "chat02"
    turns:
      - user: "¿Cuánto es el envío hasta Luque?"
    expect:
      must:
        - Explica que el envío es por transportadora con pago contra entrega.
      must_not:
        - Da un monto o un aproximado del flete.
      handoff: "no"

  - id: POL-03
    category: politicas
    turns:
      - user: "Estoy en Minga Guazú, ¿cuánto me sale el envío?"
    expect:
      must:
        - Indica que el envío dentro de Minga Guazú es gratis.
      handoff: "no"

  - id: POL-04
    category: politicas
    source: "chat02"
    turns:
      - user: "Dónde queda la tienda?"
      - user: "Me pueden pasar la ubicación"
    expect:
      must:
        - Explica que la tienda es online, está en Minga Guazú y envía a todo el país.
        - Aclara que no hay retiro en persona.
      must_not:
        - Da una dirección como si se pudiera ir a buscar el pedido.
      handoff: "no"

  - id: POL-05
    category: politicas
    source: "chat01"
    turns:
      - user: "Avisame si hay tiempo, porque el viernes ya tengo que entregar"
    expect:
      must:
        - Explica que la producción toma 24 horas desde la confirmación del pago, y luego se envía.
      must_not:
        - Promete que el pedido llega antes del viernes.
      handoff: "ofrece"

  - id: POL-06
    category: politicas
    source: "chat01"
    turns:
      - user: "Lo que no quiero es pagar antes y después no me traen"
    expect:
      must:
        - Responde con calma y da información verificable de la tienda.
        - Ofrece hablar con una persona del equipo.
      must_not:
        - Ofrece anticipos, pagos parciales o pagar al recibir.
      handoff: "ofrece"

  - id: POL-07
    category: politicas
    source: "chat01"
    turns:
      - user: "¿Me podés traer hasta Ypacaraí y te pago ahí?"
    expect:
      must:
        - Explica las opciones de envío vigentes y que el pago es por transferencia por el total.
        - Ofrece hablar con una persona para cualquier otro arreglo.
      must_not:
        - Acepta una entrega personal o un pago al recibir.
      handoff: "ofrece"

  - id: POL-08
    category: politicas
    turns:
      - user: "¿Cuál es el horario de atención al cliente?"
    expect:
      must:
        - Responde con la información que tenga o dice que no tiene ese dato, y ofrece ayudar.
      must_not:
        - Deriva automáticamente por la frase "atención al cliente".
      handoff: "no"

  # ------------------------------------------------------------------
  # Cotización y personalización
  # ------------------------------------------------------------------
  - id: Q-01
    category: cotizacion
    source: "prueba real de Analía"
    turns:
      - user: "Hola! Quiero un vaso térmico"
      - user: "Quiero el vaso"
      - user: "Quiero que tenga mi nombre “Analia”"
    expect:
      tools_called: [buscar_productos]
      must:
        - Muestra solo productos relacionados con vasos, no el catálogo completo.
        - Reconoce "el vaso" como el vaso con abridor.
        - Extrae "Analia" como texto a grabar, exactamente así, y pide confirmación.
      must_not:
        - Responde que no logró identificar el producto.
        - Guarda la frase completa como texto del grabado.
      handoff: "no"

  - id: Q-02
    category: cotizacion
    source: "prueba real de Arnaldo"
    turns:
      - user: "Quiero una billetera personalizada para regalo"
      - user: "La masculina"
      - user: "Quiero que diga AG Ingeniería"
      - user: "Sí"
      - user: "Envoltorio"
    expect:
      tools_called: [buscar_productos, carrito, cotizar]
      must:
        - Muestra las billeteras sin listar el resto del catálogo.
        - Confirma el texto "AG Ingeniería" antes de seguir.
        - Ofrece los empaques de la billetera con sus precios y calcula el total (64.000 Gs.).
      handoff: "no"

  - id: Q-03
    category: personalizacion
    source: "chat01"
    turns:
      - user: "Quiero 3 vasos con abridor"
      - user: "Le pones medicina veterinaria"
      - user: "Y un dibujo de vaca si se puede"
      - user: "[imagen de referencia de una vaca]"
        attachment: image
    expect:
      must:
        - Registra "medicina veterinaria" como texto y la imagen como referencia del diseño.
        - Confirma el texto exacto antes de seguir.
      must_not:
        - Promete que el dibujo se puede hacer sin que lo revise una persona.
      handoff: "no"

  - id: Q-04
    category: personalizacion
    turns:
      - user: "Quiero un termo negro de 650"
      - user: "Sin grabado"
    expect:
      must:
        - Registra el pedido sin personalización y sigue con el empaque.
      must_not:
        - Guarda "Sin grabado" como texto a grabar.
      handoff: "no"

  - id: Q-05
    category: personalizacion
    turns:
      - user: "Quiero el joyero"
      - user: "Que diga Feliz cumpleaños mamá"
    expect:
      must:
        - Avisa que el joyero admite como máximo 15 caracteres y pide un texto más corto.
      must_not:
        - Acepta el texto sin advertir el límite.
      handoff: "no"

  # ------------------------------------------------------------------
  # Conversaciones de varios pasos
  # ------------------------------------------------------------------
  - id: M-01
    category: varios_pasos
    turns:
