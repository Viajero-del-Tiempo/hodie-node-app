# Evaluación del agente conversacional de HoDie
#
# Ubicación en el repo: test/eval/conversations.yaml
#
# Cada caso define el COMPORTAMIENTO esperado, no el texto exacto de la respuesta.
# - tools_called / tools_not_called: se verifican de forma determinística sobre las
#   llamadas a herramientas que hizo el agente.
# - must / must_not: se verifican con un evaluador LLM que recibe la conversación,
#   la respuesta del agente y estos criterios.
# - handoff: "si" (deriva), "no" (no deriva), "ofrece" (ofrece una persona pero no deriva).
#
# Los nombres de herramientas siguen la tabla de docs/SPEC-agente.md. "carrito" es un
# alias de la familia carrito_ver / carrito_agregar / carrito_modificar / carrito_quitar.
#
# El catálogo, las políticas y los pedidos de abajo son datos de prueba (fixtures).
# Reflejan la tienda real para que los casos sean realistas, pero el runner NO lee
# Firestore de producción: carga estos datos en memoria.
#
# ---------------------------------------------------------------------------------
# FORMATO DE context (todos los campos son opcionales; el runner no interpreta texto
# libre: una clave desconocida es un error del caso)
#
#   telefonoCliente: "5959..."      Teléfono verificado del cliente (phoneVerified: true).
#                                    Sin este campo, el teléfono queda sin resolver.
#   sesionNueva: true                El turno empieza una sesión nueva (sin historial
#                                    de la sesión anterior para el modelo).
#   historialPrevio:                 Mensajes de una sesión ANTERIOR, que el modelo no
#     haceHoras: 48                  debe recibir. Sirve para probar el corte de sesión.
#     duranteHandoff: true
#     mensajes:
#       - cliente: "texto"
#   conversacion:                    Mensajes previos de la sesión ACTUAL, literales,
#     - cliente: "texto"             en orden. El modelo los recibe como historial.
#     - agente: "texto"
#   carrito:                         Carrito persistido del cliente.
#     actualizadoHaceHoras: 24
#     lineas:
#       - { producto: <id>, variante: <id>, cantidad: 1, texto: "Juan" | null,
#           empaque: <type> | null }
#     envio: { destinatario, documento, ciudad, departamento, direccion, telefono }
#     facturacion: { requiere: false } | { requiere: true, razonSocial, ruc }
#   cotizacionMostrada: true         El runner calcula la cotización del carrito inicial
#                                    con la herramienta real y la registra como mostrada
#                                    en el turno anterior (lastQuote).
# ---------------------------------------------------------------------------------

